AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31
Description: Bot de Telegram que acompaña a completar las 21 badges de AWS Builder Center (serverless).

Parameters:
  TokenParameter:
    Type: String
    Default: /builder-badge-bot/telegram-token
    Description: Nombre del parámetro SecureString en SSM con el token de BotFather.
  WebhookSecret:
    Type: String
    NoEcho: true
    Description: Secreto compartido con Telegram (header X-Telegram-Bot-Api-Secret-Token).
  MiniAppUrl:
    Type: String
    Default: ""
    Description: >-
      URL pública de la Mini App (la propia Function URL). Se pasa como parámetro porque
      referenciarla desde la función que la sirve creaba una dependencia circular: se deja
      vacía en el primer despliegue y se rellena en el segundo con el valor de WebhookUrl.
  BedrockModelId:
    Type: String
    Default: us.amazon.nova-lite-v1:0
    Description: >-
      Modelo de Bedrock para el mensaje motivador diario (uno por usuario y día, cacheado).
      Déjalo vacío para desactivar Bedrock y usar solo los mensajes estáticos.
  DefaultTimezone:
    Type: String
    Default: America/Bogota
  ScheduleWindowMinutes:
    Type: Number
    Default: 15
    Description: Cada cuántos minutos corre el scheduler (debe coincidir con el cron).

Globals:
  Function:
    Runtime: python3.12
    Architectures: [arm64]
    MemorySize: 512
    Timeout: 30
    Environment:
      Variables:
        BOT_TABLE: !Ref Table
        BOT_DEFAULT_TZ: !Ref DefaultTimezone
        TOKEN_PARAMETER: !Ref TokenParameter
        MINIAPP_URL: !Ref MiniAppUrl
        BEDROCK_MODEL_ID: !Ref BedrockModelId

Resources:
  Table:
    Type: AWS::DynamoDB::Table
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: pk
          AttributeType: S
        - AttributeName: sk
          AttributeType: S
      KeySchema:
        - AttributeName: pk
          KeyType: HASH
        - AttributeName: sk
          KeyType: RANGE
      TimeToLiveSpecification:
        AttributeName: ttl
        Enabled: true

  WebhookFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: .
      Handler: bot.lambda_webhook.handler
      Environment:
        Variables:
          WEBHOOK_SECRET: !Ref WebhookSecret
      FunctionUrlConfig:
        AuthType: NONE
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref Table
        - Statement:
            - Effect: Allow
              Action: ssm:GetParameter
              Resource: !Sub "arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter${TokenParameter}"
            - Effect: Allow
              Action: kms:Decrypt
              Resource: "*"
              Condition:
                StringEquals:
                  kms:ViaService: !Sub "ssm.${AWS::Region}.amazonaws.com"
            - Effect: Allow
              Action: bedrock:InvokeModel
              Resource:
                - !Sub "arn:${AWS::Partition}:bedrock:${AWS::Region}::foundation-model/*"
                - !Sub "arn:${AWS::Partition}:bedrock:*:${AWS::AccountId}:inference-profile/*"

  SchedulerFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: .
      Handler: bot.lambda_scheduler.handler
      Timeout: 120
      Environment:
        Variables:
          SCHEDULE_WINDOW_MINUTES: !Ref ScheduleWindowMinutes
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref Table
        - Statement:
            - Effect: Allow
              Action: ssm:GetParameter
              Resource: !Sub "arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter${TokenParameter}"
            - Effect: Allow
              Action: kms:Decrypt
              Resource: "*"
              Condition:
                StringEquals:
                  kms:ViaService: !Sub "ssm.${AWS::Region}.amazonaws.com"
            - Effect: Allow
              Action: bedrock:InvokeModel
              Resource:
                - !Sub "arn:${AWS::Partition}:bedrock:${AWS::Region}::foundation-model/*"
                - !Sub "arn:${AWS::Partition}:bedrock:*:${AWS::AccountId}:inference-profile/*"
      Events:
        Tick:
          Type: ScheduleV2
          Properties:
            Name: !Sub "${AWS::StackName}-tick"
            ScheduleExpression: !Sub "rate(${ScheduleWindowMinutes} minutes)"
            Description: Revisa quién tiene recordatorio pendiente en su hora local.

Outputs:
  WebhookUrl:
    Description: URL que hay que registrar en Telegram con setWebhook.
    Value: !GetAtt WebhookFunctionUrl.FunctionUrl
  TableName:
    Value: !Ref Table
